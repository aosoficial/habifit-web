<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HabiFit</title>
  <meta name="description" content="HabiFit ayuda a completar retos de habitos con verificacion, ligas y rachas.">
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f1e8;
      --ink: #1f2933;
      --muted: #52616b;
      --accent: #256f5c;
      --line: #d8d0c3;
      --panel: #fffdf8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(680px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: clamp(24px, 5vw, 44px);
      box-shadow: 0 18px 50px rgba(31, 41, 51, 0.08);
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(34px, 7vw, 56px);
      line-height: 1;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.5;
    }

    nav {
      display: grid;
      gap: 10px;
      margin-top: 28px;
    }

    a {
      color: var(--accent);
      font-weight: 700;
      text-decoration: none;
    }

    nav a {
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 48px;
      padding: 13px 0;
      border-top: 1px solid var(--line);
    }

    nav a:last-child {
      border-bottom: 1px solid var(--line);
    }
  </style>
</head>
<body>
  <main>
    <h1>HabiFit</h1>
    <p>Retos de habitos con verificacion, ligas y rachas. Esta pagina publica contiene los enlaces necesarios para soporte y revision de App Store.</p>
    <nav aria-label="Enlaces de HabiFit">
      <a href="./support/">Soporte <span aria-hidden="true">→</span></a>
      <a href="./privacy/">Privacidad <span aria-hidden="true">→</span></a>
      <a href="./terms/">Terminos <span aria-hidden="true">→</span></a>
      <a href="./join/">Invitaciones <span aria-hidden="true">→</span></a>
      <a href="./social-scheduler/">Social Scheduler <span aria-hidden="true">→</span></a>
    </nav>
  </main>
</body>
</html>
